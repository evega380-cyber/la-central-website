name: Node tests
on:
  pull_request:
  push:
    branches:
      - feature/planning-center-secure-integration
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --test
